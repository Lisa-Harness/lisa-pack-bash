tool_id: bash_run
pack_id: lisa-pack-bash
module_path: lisa_packs.bash.tools.bash_run.bash_run
description: "Run one command, a background job, or a batch of independent commands in a persistent bash session. Cwd and exported env carry across calls (function bodies too when the session policy permits); empty success is explicit; rc=1 from grep/diff/test is informational; large output spills to a file path; timeouts background the work instead of killing it, bare and sandboxed alike (except sleep/git). Prefer `commands` for independent read-only fan-outs. Posture depends on sandboxed/backend/persistence: sandboxed:false = real permanent host changes (confirm before mutating); backend tmpfs = ephemeral scratch (probe freely, produce a patch); backend overlay = mergeable layer via persist/layer_id."
effect: execute
approval_required: true
approval_preview: "run shell command(s)"
display_template: "{command}"
stream_output: true
exportable: true
# Kernel wrapper timeout: 0 disables the wrapper (sdk/AUTHORING.md contract).
# bash_run self-bounds on every path: the model's own timeout_seconds parameter
# (1-300s) is the visible wait, sandboxed calls get a grace window past it
# (_AUTO_BG_MAX_TIMEOUT_SECONDS=3600) so a slow command is adopted as a job
# instead of killed, and streaming output publishes progress on
# lisa.tool_output the whole time. A wrapper lifetime bound can never be sized
# to that (the 2026-10-05 shell turn lost a command to a 30s wrapper default
# cancelling the adoption mid-flight), so the tool declares itself
# self-bounding instead of picking a magic number.
timeout_seconds: 0
